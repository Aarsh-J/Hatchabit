<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f11;
    --surface:  #161a1e;
    --surface2: #1e2329;
    --border:   #2a3040;
    --accent:   #e8ff6b;
    --text:     #eef0f4;
    --muted:    #6b7585;
    --fail:     #ff6b6b;
    --radius:   10px;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', sans-serif;
    --display:  'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  .logo {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-row { margin-bottom: 14px; }
  input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .btn {
    width: 100%;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: #000;
    margin-top: 8px;
  }
  .btn:hover { background: #d4eb50; }
  .error {
    background: #ff6b6b15;
    border: 1px solid #ff6b6b30;
    color: var(--fail);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  .switch { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .switch a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="logo"><div class="logo-dot"></div>TaskFlow</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-row">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required minlength="8">
        <div class="hint">At least 8 characters</div>
      </div>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <div class="switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></div>
  </div>
</body>
</html>
