<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f11;
    --surface:  #161a1e;
    --surface2: #1e2329;
    --border:   #2a3040;
    --accent:   #e8ff6b;
    --accent2:  #6bffd4;
    --accent3:  #ff6b9d;
    --text:     #eef0f4;
    --muted:    #6b7585;
    --success:  #6bffd4;
    --fail:     #ff6b6b;
    --partial:  #ffd06b;
    --radius:   10px;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', sans-serif;
    --display:  'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    font-size: 14px;
  }

  /* SHELL */
  .shell {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 56px 1fr;
    min-height: 100vh;
  }

  /* TOPBAR */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  .logo {
    font-family: var(--display);
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.4; transform:scale(.8); }
  }
  .topbar-date {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav-section {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 12px 12px 4px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .15s;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    width: 100%;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--surface2); color: var(--accent); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  /* MAIN */
  .main {
    overflow-y: auto;
    padding: 28px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  /* PANEL HEADER */
  .panel-header { margin-bottom: 24px; }
  .panel-sub    { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .panel-title  { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -.5px; }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* FORM */
  .form-row           { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .form-row.full      { grid-template-columns:1fr; }
  .form-row.three     { grid-template-columns:1fr 1fr 80px; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize:vertical; min-height:72px; }
  select option { background: var(--surface2); }

  /* BUTTONS */
  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:var(--radius); font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; border:none; }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-primary:hover { background:#d4eb50; transform:translateY(-1px); }
  .btn-ghost   { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .btn-danger  { background:transparent; color:var(--fail); border:1px solid #ff6b6b33; }
  .btn-danger:hover { background:#ff6b6b15; }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  /* TYPE HEADER */
  .type-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .type-badge  { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.5px; padding:4px 10px; border-radius:20px; background:var(--surface2); border:1px solid var(--border); color:var(--accent); }
  .type-line   { flex:1; height:1px; background:var(--border); }

  /* HEATMAP */
  .heatmap { display:flex; gap:4px; flex-wrap:wrap; }
  .heat-day { width:20px; height:20px; border-radius:4px; position:relative; cursor:default; }
  .heat-day.success { background:var(--success); opacity:.85; }
  .heat-day.partial { background:var(--partial); opacity:.85; }
  .heat-day.fail    { background:#ff6b6b33; border:1px solid #ff6b6b40; }
  .heat-day[title]:hover::after {
    content: attr(title);
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-family: var(--mono);
    white-space: nowrap;
    z-index: 10;
  }

  /* BAR CHART */
  .bar-chart { display:flex; align-items:flex-end; gap:6px; height:80px; margin-top:12px; }
  .bar-col   { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; }
  .bar       { width:100%; border-radius:4px 4px 0 0; min-height:2px; transition:height .4s ease; }
  .bar-label { font-family:var(--mono); font-size:9px; color:var(--muted); }

  /* PERCENT BADGE */
  .pct-badge { font-family:var(--mono); font-size:12px; padding:3px 10px; border-radius:20px; font-weight:500; }
  .pct-high  { background:#6bffd415; color:var(--success); border:1px solid #6bffd430; }
  .pct-mid   { background:#ffd06b15; color:var(--partial); border:1px solid #ffd06b30; }
  .pct-low   { background:#ff6b6b15; color:var(--fail);    border:1px solid #ff6b6b30; }

  /* STAT CARDS */
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
  .stat-card  { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center; }
  .stat-num   { font-family:var(--display); font-size:32px; font-weight:800; line-height:1; margin-bottom:6px; }
  .stat-label { font-size:11px; color:var(--muted); }

  /* EMPTY STATE */
  .empty-state { text-align:center; padding:48px 24px; color:var(--muted); }
  .empty-icon  { font-size:36px; margin-bottom:12px; }
  .empty-text  { font-size:13px; }

  /* TOAST */
  .toast {
    position:fixed; bottom:24px; right:24px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px 18px;
    font-size:13px; z-index:1000;
    animation:slideUp .25s ease;
    display:flex; align-items:center; gap:8px;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* MISC */
  .freq-badge { font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:20px; background:#e8ff6b15; color:var(--accent); border:1px solid #e8ff6b30; }
  .section-divider { height:1px; background:var(--border); margin:20px 0; }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <a class="logo" href="/">
      <div class="logo-dot"></div>TaskFlow
    </a>
    <div class="topbar-date" id="topbarDate"></div>
  </header>

  <nav class="sidebar">
    <div class="nav-section">Menu</div>
    <a class="nav-btn {% if active=='manage' %}active{% endif %}" href="/manage">
      <span class="nav-icon">⊞</span> Manage Tasks
    </a>
    <a class="nav-btn {% if active=='tracker' %}active{% endif %}" href="/tracker">
      <span class="nav-icon">◎</span> Daily Tracker
    </a>
    <a class="nav-btn {% if active=='report' %}active{% endif %}" href="/report">
      <span class="nav-icon">◈</span> Reports
    </a>
    <div style="margin-top:auto;">
      <div class="nav-section">{{ current_user.email }}</div>
      <a class="nav-btn" href="{{ url_for('auth.logout') }}">
        <span class="nav-icon">⏻</span> Log Out
      </a>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>

<script>
  // Shared date display
  function updateTopbarDate() {
    document.getElementById('topbarDate').textContent =
      new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  }
  updateTopbarDate();
  setInterval(updateTopbarDate, 60000);

  // Shared toast
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // Shared escape
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Shared pct class helper
  function pctClass(p) { return p >= 70 ? 'pct-high' : p >= 40 ? 'pct-mid' : 'pct-low'; }

  {% block extra_script %}{% endblock %}
</script>
</body>
</html>
